[project]
name = "client-slack-agents"
version = "0.1.0"
description = "Multi-tenant Slack AI agent platform (FastAPI + Celery + MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.35",
    "slack-bolt>=1.21.0,<2",
    "langgraph>=0.5,<0.7",
    "anthropic>=0.39.0,<0.50",
    "qdrant-client>=1.12.0,<2",
    "httpx>=0.27.0,<0.28",
    "celery[redis]>=5.4.0,<6",
    "redis>=5.2.0,<6",
    "psycopg[binary]>=3.2.0,<4",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.12,<0.1",
    "pypdf>=5.0.0,<6",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.1.0,<4",
    "pandas>=2.2.0,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.15",
    "pyjwt>=2.9.0,<3",
    "passlib[bcrypt]>=1.7.4,<2",
    "email-validator>=2.0.0,<3",
    "bcrypt>=4.0.1,<4.1",
    "cryptography>=43.0.0,<45",
    "stripe>=11.0.0,<13",
    "langgraph-checkpoint-postgres>=2.0.25,<3",
    "mcp>=1.12,<2",
    "fpdf2>=2.8.0,<3",
    "tldr>=3.0.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.8.0,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "mcp_server"]

[tool.uv]
package = true
