# Local infra only — app processes (uvicorn / next / celery) run on the host.
# Embedding model: BAAI/bge-small-en-v1.5 (open, CPU-friendly via TEI)

services:
  postgres:
    image: postgres:16-alpine
    container_name: csa-postgres
    environment:
      POSTGRES_USER: csa
      POSTGRES_PASSWORD: csa
      POSTGRES_DB: csa
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csa -d csa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: csa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: csa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200\\|ok\\|Ok\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: csa-tei
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--port", "80"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && echo -e \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | head -n1 | grep -q 200'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  tei_data:
